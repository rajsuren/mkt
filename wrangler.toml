name = "fieldops"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Let the Worker handle /api/* first, then fall back to static files
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "fieldops-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "fieldops-photos"

[vars]
COMPANY_NAME = "Your Company"
WORK_TIMEZONE_OFFSET_MINUTES = "330"   # 330 = India (UTC+5:30)
